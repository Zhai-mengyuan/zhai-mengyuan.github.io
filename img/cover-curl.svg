<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10142B"/>
      <stop offset="100%" stop-color="#2C2144"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C6AE0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7C6AE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#g)"/>
  <circle cx="640" cy="100" r="200" fill="url(#haze)"/>
  <circle cx="120" cy="360" r="150" fill="url(#haze)"/>

  <!-- 终端窗口 -->
  <g>
    <rect x="96" y="112" width="608" height="232" rx="14" fill="#ffffff" fill-opacity="0.05"
          stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.28"/>
    <line x1="96" y1="152" x2="704" y2="152" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.18"/>
    <circle cx="124" cy="132" r="5" fill="#B7A8FF" opacity="0.75"/>
    <circle cx="146" cy="132" r="5" fill="#ffffff" opacity="0.28"/>
    <circle cx="168" cy="132" r="5" fill="#ffffff" opacity="0.18"/>

    <!-- 命令行文本 -->
    <text x="124" y="196" font-family="monospace" font-size="21" fill="#B7A8FF" opacity="0.92">$ curl -I https://target</text>
    <text x="124" y="230" font-family="monospace" font-size="19" fill="#ffffff" opacity="0.62">HTTP/1.1 200 OK</text>
    <text x="124" y="258" font-family="monospace" font-size="19" fill="#ffffff" opacity="0.46">Server: bfe</text>
    <text x="124" y="286" font-family="monospace" font-size="19" fill="#ffffff" opacity="0.36">Content-Type: text/html</text>
    <text x="124" y="316" font-family="monospace" font-size="19" fill="#ffffff" opacity="0.28">-&gt; 请求 / 响应，一次往返</text>

    <!-- 光标 -->
    <rect x="596" y="304" width="12" height="20" fill="#B7A8FF" opacity="0.7"/>
  </g>

  <!-- 题注 -->
  <text x="96" y="392" font-family="sans-serif" font-size="26" font-weight="300"
        letter-spacing="4" fill="#ffffff" opacity="0.86">curl · 主动探测的第一把螺丝刀</text>

  <!-- 星点 -->
  <circle cx="270" cy="66" r="1.9" fill="#fff" opacity="0.8"/>
  <circle cx="352" cy="48" r="1.3" fill="#fff" opacity="0.55"/>
  <circle cx="712" cy="300" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="64" cy="204" r="1.1" fill="#fff" opacity="0.42"/>
  <circle cx="484" cy="60" r="1.4" fill="#fff" opacity="0.6"/>
  <circle cx="742" cy="392" r="1.2" fill="#fff" opacity="0.35"/>
  <text x="668" y="70" font-size="20" fill="#ffffff" opacity="0.4" font-family="sans-serif">✦</text>
  <text x="60" y="96" font-size="18" fill="#ffffff" opacity="0.32" font-family="sans-serif">☾</text>
</svg>
