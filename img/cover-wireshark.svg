  <line x1="72" y1="386" x2="728" y2="386" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14"/>

  <!-- 鲨鱼鳍（Wireshark 意象） -->
  <g transform="translate(400,232)">
    <path d="M-108,74 C-56,26 -8,-34 34,-92 C56,-30 80,26 100,74 Z"
          fill="#ffffff" fill-opacity="0.08"
          stroke="#ffffff" stroke-width="5" stroke-opacity="0.88" stroke-linejoin="round"/>
    <path d="M-62,74 L64,74" stroke="#ffffff" stroke-width="3" stroke-opacity="0.35" stroke-linecap="round"/>
    <!-- 鳍内数据流 -->
    <path d="M-34,58 C-6,34 12,6 24,-20" fill="none" stroke="#B7A8FF" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
    <path d="M-6,64 C18,44 34,20 44,-4" fill="none" stroke="#B7A8FF" stroke-width="2" stroke-opacity="0.32" stroke-linecap="round"/>
  </g>

  <!-- 十六进制点缀：Heartbeat -->
  <text x="86" y="86" font-family="monospace" font-size="20" fill="#ffffff" opacity="0.26">48 65 61 72 74</text>
  <text x="536" y="420" font-family="monospace" font-size="20" fill="#ffffff" opacity="0.22">74 6c 73 20 01 03</text>

  <!-- 星点 -->
  <circle cx="176" cy="132" r="1.9" fill="#fff" opacity="0.8"/>
  <circle cx="252" cy="72" r="1.3" fill="#fff" opacity="0.55"/>
  <circle cx="612" cy="286" r="1.5" fill="#fff" opacity="0.5"/>
