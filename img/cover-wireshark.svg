    <rect x="168" y="356" width="7" height="30" rx="3" fill="url(#bar)"/>
    <rect x="184" y="334" width="7" height="52" rx="3" fill="url(#bar)"/>
    <rect x="200" y="362" width="7" height="24" rx="3" fill="url(#bar)"/>
