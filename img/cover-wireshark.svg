    <rect x="312" y="350" width="7" height="36" rx="3" fill="url(#bar)"/>
    <rect x="328" y="358" width="7" height="28" rx="3" fill="url(#bar)"/>
    <rect x="344" y="336" width="7" height="50" rx="3" fill="#B7A8FF" opacity="0.5"/>
    <rect x="360" y="352" width="7" height="34" rx="3" fill="url(#bar)"/>
    <rect x="376" y="342" width="7" height="44" rx="3" fill="url(#bar)"/>
    <rect x="392" y="360" width="7" height="26" rx="3" fill="url(#bar)"/>
    <rect x="408" y="330" width="7" height="56" rx="3" fill="url(#bar)"/>
    <rect x="424" y="354" width="7" height="32" rx="3" fill="url(#bar)"/>
    <rect x="440" y="346" width="7" height="40" rx="3" fill="#B7A8FF" opacity="0.42"/>
