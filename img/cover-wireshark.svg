    <rect x="552" y="352" width="7" height="34" rx="3" fill="url(#bar)"/>
    <rect x="568" y="360" width="7" height="26" rx="3" fill="url(#bar)"/>
    <rect x="584" y="342" width="7" height="44" rx="3" fill="url(#bar)"/>
    <rect x="600" y="356" width="7" height="30" rx="3" fill="url(#bar)"/>
    <rect x="616" y="366" width="7" height="20" rx="3" fill="url(#bar)"/>
