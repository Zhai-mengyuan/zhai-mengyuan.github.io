<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10142B"/>
      <stop offset="100%" stop-color="#2A2350"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C6AE0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7C6AE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B7A8FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B7A8FF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#g)"/>

  <!-- 细网格 -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.045">
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <circle cx="640" cy="96" r="200" fill="url(#haze)"/>
  <circle cx="120" cy="380" r="160" fill="url(#haze)"/>

  <!-- 抓包时间轴：底部一列流量柱 -->
  <g>
    <rect x="88"  y="352" width="7" height="34" rx="3" fill="url(#bar)"/>
    <rect x="104" y="338" width="7" height="48" rx="3" fill="url(#bar)"/>
    <rect x="120" y="360" width="7" height="26" rx="3" fill="url(#bar)"/>
    <rect x="136" y="326" width="7" height="60" rx="3" fill="#B7A8FF" opacity="0.52"/>
