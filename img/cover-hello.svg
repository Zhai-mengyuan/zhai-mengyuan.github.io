<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10142B"/>
      <stop offset="100%" stop-color="#2A2250"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C6AE0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7C6AE0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#g)"/>
  <circle cx="640" cy="90" r="180" fill="url(#haze)"/>
  <circle cx="100" cy="380" r="140" fill="url(#haze)"/>
  <!-- 月牙：白圆 + 底色渐变圆叠出 -->
  <circle cx="640" cy="100" r="42" fill="#ffffff" opacity="0.92"/>
  <circle cx="659" cy="85" r="35" fill="url(#g)"/>
  <!-- 虚线飞行轨迹 -->
  <path d="M 90,330 Q 230,282 322,248" fill="none" stroke="#ffffff" stroke-width="3"
        stroke-dasharray="1 14" stroke-linecap="round" opacity="0.5"/>
  <!-- 纸飞机 -->
  <g transform="translate(360,235) rotate(-10)">
    <path d="M0,0 L100,30 L34,46 Z" fill="#ffffff" opacity="0.92"/>
    <path d="M0,0 L34,46 L26,64 Z" fill="#ffffff" opacity="0.65"/>
  </g>
  <!-- 星星与音符 -->
  <text x="200" y="118" font-size="24" fill="#ffffff" opacity="0.55" font-family="sans-serif">✦</text>
  <text x="512" y="312" font-size="20" fill="#ffffff" opacity="0.4" font-family="sans-serif">✦</text>
  <circle cx="300" cy="160" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="470" cy="120" r="2.2" fill="#fff" opacity="0.4"/>
  <circle cx="160" cy="250" r="2.2" fill="#fff" opacity="0.4"/>
  <circle cx="580" cy="230" r="1.6" fill="#fff" opacity="0.35"/>
  <circle cx="250" cy="390" r="1.6" fill="#fff" opacity="0.3"/>
  <text x="248" y="378" font-size="30" fill="#ffffff" opacity="0.45" font-family="sans-serif">♪</text>
</svg>
