<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8FB8F0"/>
      <stop offset="55%" stop-color="#B79BF0"/>
      <stop offset="100%" stop-color="#E5A9DC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#g)"/>
  <!-- 光斑 -->
  <circle cx="680" cy="80" r="140" fill="#ffffff" opacity="0.10"/>
  <circle cx="90" cy="370" r="100" fill="#ffffff" opacity="0.08"/>
  <!-- 月牙：白圆 + 同款渐变圆叠出 -->
  <circle cx="640" cy="100" r="42" fill="#ffffff" opacity="0.92"/>
  <circle cx="659" cy="85" r="35" fill="url(#g)"/>
  <!-- 虚线飞行轨迹 -->
  <path d="M 90,330 Q 230,282 322,248" fill="none" stroke="#ffffff" stroke-width="3"
        stroke-dasharray="1 14" stroke-linecap="round" opacity="0.65"/>
  <!-- 纸飞机 -->
  <g transform="translate(360,235) rotate(-10)">
    <path d="M0,0 L100,30 L34,46 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M0,0 L34,46 L26,64 Z" fill="#ffffff" opacity="0.7"/>
  </g>
  <!-- 星星与音符 -->
  <text x="200" y="118" font-size="24" fill="#ffffff" opacity="0.55" font-family="sans-serif">✦</text>
  <text x="512" y="312" font-size="20" fill="#ffffff" opacity="0.45" font-family="sans-serif">✦</text>
  <circle cx="300" cy="160" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="470" cy="120" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="160" cy="250" r="3" fill="#ffffff" opacity="0.4"/>
  <text x="248" y="378" font-size="30" fill="#ffffff" opacity="0.5" font-family="sans-serif">♪</text>
  <text x="552" y="402" font-size="24" fill="#ffffff" opacity="0.4" font-family="sans-serif">♫</text>
</svg>
