<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10142B"/>
      <stop offset="100%" stop-color="#2C2144"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C6AE0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7C6AE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#g)"/>

  <circle cx="620" cy="90" r="200" fill="url(#haze)"/>
  <circle cx="130" cy="370" r="160" fill="url(#haze)"/>

  <!-- 细网格（测绘意象） -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.045">
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- 望远镜（远望测绘意象） -->
  <g transform="translate(400,240) rotate(-24)">
    <rect x="-150" y="-30" width="220" height="58" rx="16" fill="#ffffff" fill-opacity="0.08"
          stroke="#ffffff" stroke-width="5" stroke-opacity="0.88"/>
    <rect x="70" y="-38" width="44" height="74" rx="12" fill="#ffffff" fill-opacity="0.14"
          stroke="#ffffff" stroke-width="5" stroke-opacity="0.88"/>
    <rect x="-196" y="-16" width="50" height="30" rx="10" fill="#ffffff" fill-opacity="0.08"
          stroke="#ffffff" stroke-width="4" stroke-opacity="0.7"/>
    <line x1="-96" y1="28" x2="-96" y2="96" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5"/>
    <line x1="24" y1="28" x2="24" y2="96" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5"/>
    <line x1="-120" y1="96" x2="48" y2="96" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5"/>
  </g>

  <!-- 被测目标：IP 点 + 坐标标注 -->
  <circle cx="664" cy="120" r="4" fill="#B7A8FF" opacity="0.9"/>
  <circle cx="664" cy="120" r="12" fill="none" stroke="#B7A8FF" stroke-width="1.4" stroke-opacity="0.5"/>
  <text x="620" y="102" font-family="monospace" font-size="15" fill="#B7A8FF" opacity="0.7">25.28N 110.29E</text>
  <circle cx="150" cy="96" r="3" fill="#B7A8FF" opacity="0.6"/>
  <circle cx="222" cy="60" r="2.2" fill="#B7A8FF" opacity="0.45"/>

  <!-- 坐标轴刻度点缀 -->
  <text x="80" y="420" font-family="monospace" font-size="18" fill="#ffffff" opacity="0.22">EXIF · CT · DNS</text>
  <text x="560" y="420" font-family="monospace" font-size="18" fill="#ffffff" opacity="0.22">port="22" &amp;&amp; country="CN"</text>

  <!-- 星点 -->
  <circle cx="296" cy="132" r="1.9" fill="#fff" opacity="0.8"/>
  <circle cx="352" cy="72" r="1.3" fill="#fff" opacity="0.55"/>
  <circle cx="712" cy="286" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="86" cy="176" r="1.1" fill="#fff" opacity="0.42"/>
  <circle cx="500" cy="108" r="1.4" fill="#fff" opacity="0.6"/>
  <circle cx="118" cy="264" r="1.1" fill="#fff" opacity="0.4"/>
  <text x="196" y="342" font-size="22" fill="#ffffff" opacity="0.42" font-family="sans-serif">✦</text>
  <text x="672" y="356" font-size="20" fill="#ffffff" opacity="0.36" font-family="sans-serif">☾</text>
</svg>
